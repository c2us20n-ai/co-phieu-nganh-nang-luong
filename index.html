<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0c14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cổ Phiếu NL" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/jpeg" href="Co-Phieu-Nganh-Nang-Luong.jpg" />
  <link rel="apple-touch-icon" href="Co-Phieu-Nganh-Nang-Luong.jpg" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <title>Cổ Phiếu Ngành Năng Lượng · 99 Thẻ</title>
  <style>
    :root { --gold: #fbbf24; --bg: #05060a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #e8f0ff;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: -1;
      background: url('Co-Phieu-Nganh-Nang-Luong.jpg') center / cover no-repeat;
      opacity: 0.35;
    }
    body::after {
      content: "";
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(10,8,30,0.4), rgba(5,6,10,0.92));
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: rgba(12,10,28,0.88);
      border: 1.5px solid rgba(251,191,36,0.55);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 0 40px rgba(251,191,36,0.25), 0 20px 50px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      background: linear-gradient(105deg, #fbbf24, #fde047, #a78bfa, #67e8f9);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      animation: shine 6s ease infinite;
    }
    @keyframes shine {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    p { color: #94a3b8; font-size: 0.9rem; line-height: 1.5; margin: 10px 0 18px; }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    a.btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; font-size: 0.95rem; font-weight: 800;
      border-radius: 999px; text-decoration: none; color: #0a0c14;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      box-shadow: 0 4px 18px rgba(251,191,36,0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    a.btn:hover { transform: scale(1.04); box-shadow: 0 6px 24px rgba(251,191,36,0.6); }
    a.btn.secondary {
      background: transparent; color: #fde68a;
      border: 1px solid rgba(251,191,36,0.5);
      box-shadow: none;
    }
    .note { margin-top: 16px; font-size: 0.72rem; color: #64748b; }
    #prompt {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      width: min(94vw, 480px);
      background: linear-gradient(135deg, rgba(20,12,40,0.97), rgba(8,10,22,0.98));
      border: 1px solid rgba(251,191,36,0.5);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.8rem;
      color: #fde68a;
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
      z-index: 100;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
    }
    #prompt.hidden { display: none; }
    #prompt button {
      padding: 5px 12px; font-size: 0.72rem; font-weight: 700;
      border-radius: 999px; border: none; cursor: pointer;
      background: #fbbf24; color: #0a0c14;
    }
    #prompt .x {
      background: transparent; color: #94a3b8;
      border: 1px solid rgba(148,163,184,0.4);
    }
  </style>
</head>
<body>
  <div id="prompt">
    <span>📥 <strong>Đề xuất:</strong> Tải file về máy để dùng offline</span>
    <a class="btn" style="padding:6px 14px;font-size:0.75rem" href="cards.html" download="Co-Phieu-Nganh-Nang-Luong.html">Tải HTML đầy đủ</a>
    <a class="btn secondary" style="padding:6px 12px;font-size:0.72rem" href="Co-Phieu-Nganh-Nang-Luong.jpg" download>Tải hình nền</a>
    <button type="button" class="x" id="closePrompt">Đóng</button>
  </div>

  <div class="card">
    <h1>Cổ Phiếu Ngành Năng Lượng</h1>
    <p>99 thẻ interactive cổ phiếu ngành năng lượng Việt Nam — dầu khí, điện, thủy điện, NLTT, than…</p>
    <div class="btns">
      <a class="btn" href="cards.html">🚀 Mở 99 thẻ ngay</a>
      <a class="btn secondary" href="cards.html" download="Co-Phieu-Nganh-Nang-Luong.html">📥 Tải về máy</a>
    </div>
    <p class="note">Hình nền: Co-Phieu-Nganh-Nang-Luong.jpg · GitHub Pages</p>
  </div>

  <script>
    (function(){
      var p = document.getElementById('prompt');
      var c = document.getElementById('closePrompt');
      if (localStorage.getItem('hideEnergyPrompt') === '1') p.classList.add('hidden');
      c.addEventListener('click', function(){
        p.classList.add('hidden');
        try { localStorage.setItem('hideEnergyPrompt','1'); } catch(e){}
      });
    })();
  </script>
</body>
</html>
